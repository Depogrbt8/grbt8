<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Yeşil arka plan -->
  <rect width="512" height="512" fill="#4CAF50"/>
  
  <!-- "g" harfi - beyaz -->
  <text x="128" y="360" font-family="Arial, sans-serif" font-size="280" font-weight="bold" font-style="italic" fill="#FFFFFF">g</text>
  
  <!-- "b" harfi - siyah -->
  <text x="270" y="360" font-family="Arial, sans-serif" font-size="280" font-weight="bold" fill="#000000">b</text>
</svg>

